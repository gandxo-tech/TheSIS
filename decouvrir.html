<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07080d">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SIS — Découvrir</title>
  <link rel="icon" href="https://i.ibb.co/xt8mxn0H/favicon-96x96.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body data-page="decouvrir">

<div class="page-topbar">
  <div class="page-topbar-title">Découvrir</div>
</div>

<!-- Barre de recherche -->
<div class="disc-search-wrap">
  <div class="search-bar" id="disc-search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
    <input type="text" id="disc-search-input" placeholder="Personnes, hashtags, posts…" autocomplete="off">
    <button class="disc-search-clear" id="disc-search-clear" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>

<!-- Résultats de recherche -->
<div id="search-results" style="display:none">
  <div class="disc-section-title" style="padding:10px 14px 4px;font-size:11px;color:var(--muted)">Résultats</div>
  <div id="search-results-list"></div>
</div>

<!-- Contenu découverte (masqué si recherche active) -->
<div id="disc-content">

  <!-- Trending hashtags -->
  <div class="disc-section">
    <div class="disc-section-title">🔥 Trending</div>
    <div class="disc-tags-wrap" id="trending-tags">
      <div class="skeleton" style="height:32px;width:100px;border-radius:999px;display:inline-block;margin-right:6px"></div>
      <div class="skeleton" style="height:32px;width:80px;border-radius:999px;display:inline-block;margin-right:6px"></div>
      <div class="skeleton" style="height:32px;width:110px;border-radius:999px;display:inline-block"></div>
    </div>
  </div>

  <!-- Personnes suggérées -->
  <div class="disc-section">
    <div class="disc-section-title">👥 Suggestions</div>
    <div id="suggested-users">
      <div class="notif-skeleton"><div class="skeleton" style="width:38px;height:38px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div class="skeleton" style="height:13px;width:55%"></div><div class="skeleton" style="height:11px;width:40%"></div></div></div>
      <div class="notif-skeleton"><div class="skeleton" style="width:38px;height:38px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div class="skeleton" style="height:13px;width:65%"></div><div class="skeleton" style="height:11px;width:35%"></div></div></div>
    </div>
  </div>

  <!-- Posts populaires -->
  <div class="disc-section">
    <div class="disc-section-title">⚡ Posts populaires</div>
    <div id="popular-posts"></div>
  </div>

</div>

<div id="toast-container"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
